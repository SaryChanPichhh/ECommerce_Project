name: final_project
description: "A production-ready Flutter application using GetX and Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI & Navigation
  get: ^4.7.2

  # HTTP Client
  dio: ^5.8.0

  # Local Storage
  get_storage: ^2.1.1
  device_preview: ^1.3.1
  persistent_bottom_nav_bar_v2: ^5.3.0
  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  image_picker: ^1.2.3
  crypto: ^3.0.7
  google_maps_flutter: ^2.18.1
  google_maps_flutter_android: ^2.19.10
  google_maps_flutter_platform_interface: ^2.17.0
  pointer_interceptor: ^0.10.1+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  freezed: ^3.0.6

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro-Regular.ttf
        - asset: assets/fonts/KantumruyPro-Bold.ttf
          weight: 700
  assets:
    - assets/images/